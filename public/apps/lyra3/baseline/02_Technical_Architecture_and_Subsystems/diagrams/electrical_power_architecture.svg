<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <!-- Dark theme gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Subsystem Box Gradients -->
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="battGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="busGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowGold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; fill: #f8fafc; font-size: 20px; letter-spacing: 0.5px; }
    .subtitle { font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #94a3b8; }
    .box-title { font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #f1f5f9; }
    .box-sub { font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10px; fill: #94a3b8; }
    .box-value { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; font-weight: 600; fill: #fbbf24; }
    .box-metric { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10px; fill: #38bdf8; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; text-anchor: middle; }
    .bus-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px; fill: #000; text-anchor: middle; }
    .card-border { stroke-width: 1.5; stroke-opacity: 0.8; }
  </style>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="0.5">
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300 M 0,400 L 1200,400 M 0,500 L 1200,500 M 0,600 L 1200,600 M 0,700 L 1200,700 M 0,800 L 1200,800"/>
    <path d="M 100,0 L 100,850 M 200,0 L 200,850 M 300,0 L 300,850 M 400,0 L 400,850 M 500,0 L 500,850 M 600,0 L 600,850 M 700,0 L 700,850 M 800,0 L 800,850 M 900,0 L 900,850 M 1000,0 L 1000,850 M 1100,0 L 1100,850"/>
  </g>

  <!-- Title Block Header -->
  <g transform="translate(40, 40)">
    <rect x="-10" y="-15" width="1140" height="65" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="15" y="18" class="title">LEO SIGINT SATELLITE: ELECTRICAL POWER SYSTEM (EPS) ARCHITECTURE</text>
    <text x="15" y="38" class="subtitle">Platform: 100–150 kg ESPA-Class | Regulated 28.0V ± 0.5V DC Bus | Standard Compliance: NASA-STD-7001, ECSS-E-ST-20C</text>
    
    <rect x="940" y="-3" width="170" height="40" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="1025" y="14" class="tag" fill="#f59e0b">OAP: 136.5 W (CONSUMED)</text>
    <text x="1025" y="28" class="tag" fill="#38bdf8">EOL ARRAY: 318.5 W (+29.4%)</text>
  </g>

  <!-- LEFT: PHOTOVOLTAIC GENERATION (Solar Wings + SADM + MPPT) -->
  <g transform="translate(40, 130)">
    <rect x="0" y="0" width="220" height="660" rx="10" fill="url(#solarGrad)" stroke="#38bdf8" class="card-border" filter="url(#boxShadow)"/>
    <rect x="15" y="15" width="190" height="30" rx="5" fill="#0284c7" fill-opacity="0.2"/>
    <text x="110" y="34" class="box-title" text-anchor="middle" fill="#38bdf8">PHOTOVOLTAIC ARRAY</text>
    
    <!-- Wing 1 -->
    <rect x="15" y="65" width="190" height="135" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="25" y="87" class="box-title">Solar Wing +Y (Deployable)</text>
    <text x="25" y="105" class="box-sub">Azur Space 3G30A GaAs</text>
    <text x="25" y="123" class="box-sub">2 Panels | Area: 0.575 m²</text>
    <text x="25" y="141" class="box-sub">Triple-Junction η = 30.5%</text>
    <text x="25" y="165" class="box-value">BOL: 190.8 W | EOL: 159.3 W</text>
    <text x="25" y="183" class="box-metric">Voc = 42.4V | Isc = 4.95A</text>

    <!-- Wing 2 -->
    <rect x="15" y="215" width="190" height="135" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
    <text x="25" y="237" class="box-title">Solar Wing -Y (Deployable)</text>
    <text x="25" y="255" class="box-sub">Azur Space 3G30A GaAs</text>
    <text x="25" y="273" class="box-sub">2 Panels | Area: 0.575 m²</text>
    <text x="25" y="291" class="box-sub">Triple-Junction η = 30.5%</text>
    <text x="25" y="315" class="box-value">BOL: 190.8 W | EOL: 159.3 W</text>
    <text x="25" y="333" class="box-metric">Voc = 42.4V | Isc = 4.95A</text>

    <!-- SADM Mechanisms -->
    <rect x="15" y="365" width="190" height="90" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="25" y="387" class="box-title">Dual SADM Drives</text>
    <text x="25" y="405" class="box-sub">Single-Axis Stepper Motors</text>
    <text x="25" y="423" class="box-sub">Continuous Sun Tracking</text>
    <text x="25" y="441" class="box-metric">Gold-on-Gold Slip Rings</text>

    <!-- Dual MPPT Regulators -->
    <rect x="15" y="470" width="190" height="165" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="25" y="495" class="box-title" fill="#f59e0b">Dual Digital MPPT</text>
    <text x="25" y="515" class="box-sub">Synchronous Buck Regulators</text>
    <text x="25" y="535" class="box-sub">Perturb &amp; Observe (P&amp;O)</text>
    <text x="25" y="555" class="box-sub">Efficiency: 96.5%</text>
    <text x="25" y="580" class="box-value">Input: 32V–42V DC</text>
    <text x="25" y="600" class="box-value">Output: Regulated 28.0V</text>
    <text x="25" y="620" class="box-metric">CAN Bus 2.0B Telemetry</text>
  </g>

  <!-- CONNECTIONS: Solar -> MPPT -->
  <path d="M 205,200 L 225,200 L 225,520 L 205,520" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M 205,350 L 235,350 L 235,550 L 205,550" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- CENTER: 28V MAIN REGULATED BUS -->
  <g transform="translate(300, 130)">
    <!-- Main 28V Bus Bar (Vertical Copper Spine) -->
    <rect x="0" y="50" width="40" height="560" rx="8" fill="url(#busGrad)" stroke="#d97706" stroke-width="2" filter="url(#busGlow)"/>
    <text x="20" y="340" class="bus-text" transform="rotate(-90 20 340)">28.0V ± 0.5V DC REGULATED MAIN POWER BUS</text>

    <!-- MPPT Feed into Bus -->
    <path d="M -55,420 L 0,420" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowGold)"/>
    <circle cx="0" cy="420" r="5" fill="#f59e0b"/>
    <text x="-45" y="410" class="tag" fill="#fbbf24">318.5W EOL</text>
  </g>

  <!-- BATTERY ENERGY STORAGE SUBSYSTEM (Below Center Bus) -->
  <g transform="translate(390, 130)">
    <rect x="0" y="0" width="230" height="300" rx="10" fill="url(#battGrad)" stroke="#38bdf8" class="card-border" filter="url(#boxShadow)"/>
    <rect x="15" y="15" width="200" height="30" rx="5" fill="#0284c7" fill-opacity="0.2"/>
    <text x="115" y="34" class="box-title" text-anchor="middle" fill="#38bdf8">ENERGY STORAGE SYSTEM</text>

    <!-- Battery Pack Info -->
    <rect x="15" y="60" width="200" height="120" rx="6" fill="#0f172a" stroke="#0369a1" stroke-width="1"/>
    <text x="25" y="82" class="box-title">480 Wh LiFePO4 Battery</text>
    <text x="25" y="100" class="box-sub">Chemistry: Lithium Iron Phosphate</text>
    <text x="25" y="118" class="box-sub">Configuration: 8S4P (32 Cells)</text>
    <text x="25" y="136" class="box-sub">Bus Voltage: 25.6V – 29.2V</text>
    <text x="25" y="158" class="box-value">Nominal: 17.1 Ah / 480 Wh</text>

    <!-- BCDR Charge / Discharge Regulators -->
    <rect x="15" y="190" width="200" height="95" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="25" y="212" class="box-title" fill="#f59e0b">Dual BCDR Regulators</text>
    <text x="25" y="230" class="box-sub">Bidirectional DC-DC Converter</text>
    <text x="25" y="248" class="box-value">Max Eclipse DoD: 18.87%</text>
    <text x="25" y="268" class="box-metric">Cycle Life: &gt; 25,000 Cycles</text>
  </g>

  <!-- Bi-Directional Bus connection to BCDR -->
  <path d="M 340,350 L 390,350" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <path d="M 390,350 L 340,350" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowGold)"/>
  <text x="365" y="340" class="tag" fill="#f59e0b">CHARGE/DISCHARGE</text>

  <!-- PDCU: POWER DISTRIBUTION AND CONTROL UNIT (Middle Center) -->
  <g transform="translate(390, 450)">
    <rect x="0" y="0" width="230" height="340" rx="10" fill="#1e293b" stroke="#10b981" class="card-border" filter="url(#boxShadow)"/>
    <rect x="15" y="15" width="200" height="30" rx="5" fill="#059669" fill-opacity="0.2"/>
    <text x="115" y="34" class="box-title" text-anchor="middle" fill="#10b981">PDCU DISTRIBUTION UNIT</text>

    <text x="20" y="70" class="box-title">Solid-State Power Control</text>
    <text x="20" y="88" class="box-sub">• Latching Current Limiters (e-Fuses)</text>
    <text x="20" y="104" class="box-sub">• High-Side P-MOSFET Switches</text>
    <text x="20" y="120" class="box-sub">• Autonomous Hardware OCP / UVLO</text>
    <text x="20" y="136" class="box-sub">• 10 Hz Telemetry (V, I, T) via CAN</text>

    <!-- DC-DC Conversion Block -->
    <rect x="15" y="155" width="200" height="165" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="25" y="177" class="box-title">Auxiliary DC-DC Regulators</text>
    <text x="25" y="198" class="box-value">+12.0V Rail : ADCS &amp; SSPA (45W)</text>
    <text x="25" y="222" class="box-value">+5.0V Rail  : C&amp;DH &amp; Sensors (25W)</text>
    <text x="25" y="246" class="box-value">+3.3V Rail  : Logic &amp; Telemetry (15W)</text>
    <text x="25" y="270" class="box-value">POL (0.85V) : RFSoC &amp; Orin Core (120W)</text>
    <text x="25" y="295" class="box-metric">Isolated Space-Grade Converters</text>
  </g>

  <!-- Bus to PDCU Connection -->
  <path d="M 340,510 L 390,510" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrowGold)"/>
  <circle cx="340" cy="510" r="5" fill="#f59e0b"/>

  <!-- RIGHT: LOAD SUBSYSTEMS (SWaP-C Consuming Loads) -->
  <g transform="translate(680, 130)">
    <rect x="0" y="0" width="480" height="660" rx="10" fill="#0f172a" stroke="#475569" class="card-border" filter="url(#boxShadow)"/>
    <rect x="20" y="15" width="440" height="30" rx="5" fill="#334155" fill-opacity="0.4"/>
    <text x="240" y="34" class="box-title" text-anchor="middle" fill="#f8fafc">SPACECRAFT CONSUMER SUBSYSTEM LOADS</text>

    <!-- 1. RF Payload (Peak: 269.0 W) -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="440" height="110" rx="8" fill="#1e1e38" stroke="#a855f7" stroke-width="1.5"/>
      <text x="15" y="22" class="box-title" fill="#c084fc">1. SIGINT RF PAYLOAD SUBSYSTEM (PRIMARY MISSION LOAD)</text>
      <text x="15" y="42" class="box-sub">• 5-Band Front-End RFFE Module (32.0W) | 4x 5.2 GSPS 12-bit ADCs (52.0W)</text>
      <text x="15" y="58" class="box-sub">• AMD/Xilinx RFSoC 128-ch PFB (95.0W) | Space Jetson Orin NX Edge AI (65.0W)</text>
      <text x="15" y="74" class="box-sub">• Payload DC-DC Power Conditioning Unit &amp; Regulators (25.0W)</text>
      <rect x="300" y="82" width="125" height="20" rx="4" fill="#581c87"/>
      <text x="362" y="96" class="box-value" fill="#f5d0fe" text-anchor="middle">PEAK: 269.0 W</text>
    </g>

    <!-- 2. High-Rate Downlink & Optical ISL (Peak: 58.0 W) -->
    <g transform="translate(20, 180)">
      <rect x="0" y="0" width="440" height="75" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
      <text x="15" y="22" class="box-title" fill="#93c5fd">2. HIGH-RATE DOWNLINK &amp; OPTICAL ISL</text>
      <text x="15" y="40" class="box-sub">• X-Band 10W GaN SSPA (45.0W DC) | 300 Mbps Downlink</text>
      <text x="15" y="56" class="box-sub">• 1550 nm Optical Laser Crosslink Terminal (13.0W DC) | 1.0 Gbps ISL</text>
      <rect x="300" y="48" width="125" height="20" rx="4" fill="#1e3a8a"/>
      <text x="362" y="62" class="box-value" fill="#bfdbfe" text-anchor="middle">PEAK: 58.0 W</text>
    </g>

    <!-- 3. ADCS Subsystem (Peak: 28.5 W) -->
    <g transform="translate(20, 265)">
      <rect x="0" y="0" width="440" height="75" rx="8" fill="#431407" stroke="#ea580c" stroke-width="1"/>
      <text x="15" y="22" class="box-title" fill="#fdba74">3. ATTITUDE DETERMINATION &amp; CONTROL (ADCS)</text>
      <text x="15" y="40" class="box-sub">• 4x 0.1 Nms Reaction Wheels in Pyramid (16.0W peak slewing)</text>
      <text x="15" y="56" class="box-sub">• Dual Sodern Star Trackers (5.5W) | Tactical IMU, Magnetorquers, GNSS (7.0W)</text>
      <rect x="300" y="48" width="125" height="20" rx="4" fill="#7c2d12"/>
      <text x="362" y="62" class="box-value" fill="#fed7aa" text-anchor="middle">PEAK: 28.5 W</text>
    </g>

    <!-- 4. C&DH & Avionics (Peak: 18.0 W) -->
    <g transform="translate(20, 350)">
      <rect x="0" y="0" width="440" height="65" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="20" class="box-title" fill="#6ee7b7">4. COMMAND &amp; DATA HANDLING (C&amp;DH)</text>
      <text x="15" y="38" class="box-sub">• Dual ARM Cortex-R5/A53 OBC (10.0W) | SpaceWire Crossbar (3.0W)</text>
      <text x="15" y="52" class="box-sub">• 1 TB Rad-Hard NVMe Solid-State Recorder (5.0W peak write)</text>
      <rect x="300" y="38" width="125" height="20" rx="4" fill="#065f46"/>
      <text x="362" y="52" class="box-value" fill="#a7f3d0" text-anchor="middle">PEAK: 18.0 W</text>
    </g>

    <!-- 5. TT&C S-Band Transponder (Peak: 14.0 W) -->
    <g transform="translate(20, 425)">
      <rect x="0" y="0" width="440" height="65" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="15" y="20" class="box-title" fill="#e2e8f0">5. TT&amp;C S-BAND TRANSPONDER</text>
      <text x="15" y="38" class="box-sub">• Dual Coherent S-Band Transponder: 14.0W (Tx/Rx) / 6.0W (Rx Standby)</text>
      <text x="15" y="52" class="box-sub">• 4x Isocone Hemispheric Patch Antennas (Passive)</text>
      <rect x="300" y="38" width="125" height="20" rx="4" fill="#334155"/>
      <text x="362" y="52" class="box-value" fill="#f1f5f9" text-anchor="middle">PEAK: 14.0 W</text>
    </g>

    <!-- 6. Thermal Control & Propulsion (Peak: 10.0 W) -->
    <g transform="translate(20, 500)">
      <rect x="0" y="0" width="440" height="65" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
      <text x="15" y="20" class="box-title" fill="#fda4af">6. PROPULSION &amp; THERMAL CONTROL</text>
      <text x="15" y="38" class="box-sub">• LMP-103S Catalyst Bed Heaters &amp; Latch Valves (5.0W)</text>
      <text x="15" y="52" class="box-sub">• Active Survival Heaters for Battery &amp; Tank (5.0W active / 25W safe mode)</text>
      <rect x="300" y="38" width="125" height="20" rx="4" fill="#881337"/>
      <text x="362" y="52" class="box-value" fill="#fecdd3" text-anchor="middle">PEAK: 10.0 W</text>
    </g>

    <!-- SUMMARY OF PEAK TOTAL POWER -->
    <rect x="20" y="580" width="440" height="65" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="35" y="605" class="box-title" fill="#fbbf24">TOTAL SPACECRAFT POWER (MODE 3 COLLECTION DWELL)</text>
    <text x="35" y="628" class="box-metric">CBE: 350.0 W | Design Margin (+20%): +70.0 W | MEP: 420.0 W</text>
  </g>

  <!-- Distribution Lines from PDCU to Loads -->
  <g fill="none" stroke-width="2">
    <!-- To Payload -->
    <path d="M 620,530 L 650,530 L 650,245 L 680,245" stroke="#c084fc" marker-end="url(#arrowGold)"/>
    <!-- To Downlink -->
    <path d="M 620,550 L 655,550 L 655,345 L 680,345" stroke="#60a5fa" marker-end="url(#arrowGold)"/>
    <!-- To ADCS -->
    <path d="M 620,570 L 660,570 L 660,430 L 680,430" stroke="#fb923c" marker-end="url(#arrowGold)"/>
    <!-- To CDH -->
    <path d="M 620,590 L 665,590 L 665,510 L 680,510" stroke="#34d399" marker-end="url(#arrowGold)"/>
    <!-- To TTC -->
    <path d="M 620,610 L 670,610 L 670,585 L 680,585" stroke="#94a3b8" marker-end="url(#arrowGold)"/>
    <!-- To Prop/Thermal -->
    <path d="M 620,630 L 680,630" stroke="#fb7185" marker-end="url(#arrowGold)"/>
  </g>

  <!-- Footer Info -->
  <g transform="translate(40, 810)">
    <text x="0" y="15" class="subtitle" fill="#64748b">LEO SIGINT System Engineering Baseline | Milestone 2 Deliverable: FEAT-02-03 | File: electrical_power_architecture.svg</text>
    <text x="1120" y="15" class="subtitle" fill="#64748b" text-anchor="end">REV 1.0 (VERIFIED)</text>
  </g>
</svg>
